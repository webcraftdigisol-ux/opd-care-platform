# Reverse proxy for the backend API, terminating on the EC2 box itself
# (no ALB, to keep costs down at small scale -- see README's AWS costing
# notes). The frontend is served separately from S3 + CloudFront and does
# NOT go through this file.
#
# One-time setup on the server:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/opd-care-api
#   sudo ln -s /etc/nginx/sites-available/opd-care-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.yourclinic.example
#
# certbot rewrites this file in place to add the SSL server block and
# handles renewal automatically after that -- don't hand-edit the SSL
# parts it adds.

server {
    listen 80;
    server_name api.yourclinic.example;  # replace with your real API subdomain

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
