services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: opd
      POSTGRES_PASSWORD: opd
      POSTGRES_DB: opd_care
    ports:
      - "5432:5432"
    volumes:
      - opd_postgres_data:/var/lib/postgresql/data

volumes:
  opd_postgres_data:
